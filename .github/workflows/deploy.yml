name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-transvigo-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Create deployment archive
        run: tar -czf dist.tar.gz -C dist .

      - name: Verify deployment secrets
        run: |
          missing=0
          if [ -z "${{ secrets.EC2_HOST }}" ]; then
            echo "::error::EC2_HOST is not set. Add it under Settings → Secrets and variables → Actions."
            missing=1
          fi
          if [ -z "${{ secrets.EC2_USER }}" ]; then
            echo "::error::EC2_USER is not set (use: ubuntu)."
            missing=1
          fi
          if [ -z "${{ secrets.EC2_SSH_KEY }}" ]; then
            echo "::error::EC2_SSH_KEY is not set. Paste your full .pem file contents."
            missing=1
          fi
          exit "$missing"

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail

          KEY_FILE="${RUNNER_TEMP}/ec2_deploy_key"
          printf '%s\n' "$EC2_SSH_KEY" | tr -d '\r' > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          SSH_OPTS=(
            -i "$KEY_FILE"
            -o BatchMode=yes
            -o StrictHostKeyChecking=accept-new
          )

          scp "${SSH_OPTS[@]}" dist.tar.gz "${EC2_USER}@${EC2_HOST}:/tmp/dist.tar.gz"

          ssh "${SSH_OPTS[@]}" "${EC2_USER}@${EC2_HOST}" bash -s <<'REMOTE'
          set -euo pipefail
          sudo mkdir -p /var/www/transvigo
          sudo tar -xzf /tmp/dist.tar.gz -C /var/www/transvigo
          sudo chown -R www-data:www-data /var/www/transvigo
          rm -f /tmp/dist.tar.gz
          REMOTE
