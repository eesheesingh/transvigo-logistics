# One-time setup on EC2 (Ubuntu):
#   sudo cp deploy/nginx-transvigo.in.conf /etc/nginx/sites-available/transvigo
#   sudo ln -sf /etc/nginx/sites-available/transvigo /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d transvigo.in -d www.transvigo.in

server {
    listen 80;
    listen [::]:80;
    server_name transvigo.in www.transvigo.in;

    root /var/www/transvigo;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
